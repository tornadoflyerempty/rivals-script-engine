<svg viewBox="0 0 1200 360" width="1200" height="360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#151b28"/>
      <stop offset="100%" stop-color="#1a1030"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff2e5b" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ff2e5b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="360" fill="url(#bg)"/>

  <circle cx="180" cy="80" r="180" fill="url(#glow1)"/>
  <circle cx="1040" cy="300" r="200" fill="url(#glow2)"/>

  <g opacity="0.12" stroke="#ffffff" stroke-width="1.5" fill="none">
    <line x1="60" y1="40" x2="140" y2="40"/>
    <line x1="100" y1="0" x2="100" y2="80"/>
    <circle cx="100" cy="40" r="6"/>

    <line x1="1080" y1="330" x2="1160" y2="330"/>
    <line x1="1120" y1="290" x2="1120" y2="360"/>
    <circle cx="1120" cy="330" r="6"/>
  </g>

  <g opacity="0.15" stroke="#8ab4ff" stroke-width="1" fill="none">
    <polygon points="1000,40 1030,55 1030,85 1000,100 970,85 970,55"/>
    <polygon points="150,300 180,315 180,345 150,360 120,345 120,315"/>
  </g>

  <g opacity="0.1" fill="#ffffff">
    <circle cx="900" cy="60" r="3"/>
    <circle cx="940" cy="90" r="2"/>
    <circle cx="260" cy="250" r="3"/>
    <circle cx="300" cy="290" r="2"/>
    <circle cx="700" cy="40" r="2"/>
    <circle cx="500" cy="320" r="2"/>
  </g>

  <text x="600" y="165" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="56.0" font-weight="bold" fill="#ffffff">
    <tspan x="600" dy="0">RIVALS (Roblox) Script</tspan>
  </text>

  <text x="600" y="225" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20.0" fill="#c9d1d9">
    <tspan x="600" dy="0">Script engine for RIVALS (Roblox) players — reads match data, processes stats,</tspan>
    <tspan x="600" dy="30">exports loadout configs.</tspan>
  </text>
</svg>